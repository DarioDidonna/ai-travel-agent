[project]
name = "travel-agent-api"
version = "0.1.0"
description = "Agente AI per la pianificazione di viaggi: FastAPI + LangChain, voli e hotel reali via SerpApi, modelli Gemini/OpenAI/Ollama"
authors = [
    {name = "Dario Didonna"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.162.5,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "google-search-results (>=2.4.2,<3.0.0)",
    "langchain-google-genai (>=4.5.0,<5.0.0)",
    "langchain (>=1.5.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "travel_agent_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: stile PEP 8, F: errori (import inutilizzati, nomi non definiti), I: ordine degli import,
# B: bug comuni (bugbear), UP: sintassi Python moderna
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=travel_agent_api --cov-report=term-missing"

[tool.coverage.report]
skip_covered = true
# La CI fallisce se la copertura scende sotto questa soglia
fail_under = 90
